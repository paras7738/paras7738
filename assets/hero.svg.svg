<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 310" width="100%">
  <defs>
    <linearGradient id="heroMesh" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0E7FF" />
      <stop offset="35%" stop-color="#DCFCE7" />
      <stop offset="70%" stop-color="#E0F2FE" />
      <stop offset="100%" stop-color="#CCFBF1" />
    </linearGradient>
    <radialGradient id="purpleGlow" cx="15%" cy="85%" r="55%">
      <stop offset="0%" stop-color="#C4B5FD" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#C4B5FD" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="mintGlow" cx="85%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#99F6E4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#99F6E4" stop-opacity="0" />
    </radialGradient>
    <filter id="heroShadow" x="-4%" y="-4%" width="108%" height="114%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#64748B" flood-opacity="0.14" />
    </filter>
    <filter id="pillShadow" x="-8%" y="-8%" width="116%" height="128%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#475569" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Main Rounded Pastel Card -->
  <rect x="12" y="10" width="936" height="266" rx="24" fill="url(#heroMesh)" stroke="#FFFFFF" stroke-width="2.5" filter="url(#heroShadow)" />
  <rect x="12" y="10" width="936" height="266" rx="24" fill="url(#purpleGlow)" />
  <rect x="12" y="10" width="936" height="266" rx="24" fill="url(#mintGlow)" />

  <!-- Left Constellation / Neural Network Lines -->
  <g stroke="#818CF8" stroke-width="0.9" opacity="0.45" fill="none">
    <path d="M 12 140 Q 90 180 180 276" />
    <path d="M 12 190 Q 110 210 240 276" />
    <path d="M 12 95 L 85 165 L 45 245 L 135 276" />
    <path d="M 85 165 L 165 215 L 135 276" />
    <path d="M 165 215 L 235 255" />
    <circle cx="85" cy="165" r="3" fill="#818CF8" />
    <circle cx="45" cy="245" r="2.5" fill="#818CF8" />
    <circle cx="165" cy="215" r="3.5" fill="#6366F1" />
    <circle cx="120" cy="240" r="2.5" fill="#818CF8" />
  </g>

  <!-- Right Constellation / Neural Network Lines -->
  <g stroke="#14B8A6" stroke-width="0.9" opacity="0.45" fill="none">
    <path d="M 740 10 Q 830 85 948 140" />
    <path d="M 810 10 L 860 75 L 948 95" />
    <path d="M 860 75 L 795 125 L 910 190 L 948 165" />
    <path d="M 690 10 L 795 125" />
    <circle cx="860" cy="75" r="3" fill="#0D9488" />
    <circle cx="795" cy="125" r="3.5" fill="#14B8A6" />
    <circle cx="910" cy="190" r="2.5" fill="#0D9488" />
  </g>

  <!-- Hero Typography -->
  <text x="480" y="92" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, &#39;Inter&#39;, &#39;Segoe UI&#39;, sans-serif" font-size="50" font-weight="900" fill="#0F172A" letter-spacing="1.5">PARAS PATEL</text>
  <text x="480" y="132" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, &#39;Inter&#39;, &#39;Segoe UI&#39;, sans-serif" font-size="25" font-weight="500" fill="#1E293B" letter-spacing="1.2">AI / ML ENGINEER</text>
  <text x="480" y="164" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, &#39;Inter&#39;, &#39;Segoe UI&#39;, sans-serif" font-size="13.5" font-weight="600" fill="#334155" letter-spacing="0.8">BUILDING AUTONOMOUS SYSTEMS, AGENTS, & SCALABLE AI ARCHITECTURE</text>

  <!-- 3 Frosted White Pill Buttons -->
  <!-- Email Pill -->
  <g transform="translate(278, 188)" filter="url(#pillShadow)">
    <rect width="114" height="38" rx="19" fill="#FFFFFF" fill-opacity="0.9" stroke="#FFFFFF" stroke-width="1.5" />
    <rect x="20" y="12" width="18" height="14" rx="2.5" fill="none" stroke="#64748B" stroke-width="1.8" />
    <path d="M 20 13 L 29 20 L 38 13" fill="none" stroke="#64748B" stroke-width="1.8" />
    <text x="47" y="24" font-family="-apple-system, BlinkMacSystemFont, &#39;Inter&#39;, sans-serif" font-size="14.5" font-weight="600" fill="#1E293B">Email</text>
  </g>

  <!-- LinkedIn Pill -->
  <g transform="translate(406, 188)" filter="url(#pillShadow)">
    <rect width="136" height="38" rx="19" fill="#FFFFFF" fill-opacity="0.9" stroke="#FFFFFF" stroke-width="1.5" />
    <rect x="20" y="10" width="18" height="18" rx="3.5" fill="#0A66C2" />
    <text x="24" y="24" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF">in</text>
    <text x="46" y="24" font-family="-apple-system, BlinkMacSystemFont, &#39;Inter&#39;, sans-serif" font-size="14.5" font-weight="600" fill="#1E293B">LinkedIn</text>
  </g>

  <!-- GitHub Pill -->
  <g transform="translate(556, 188)" filter="url(#pillShadow)">
    <rect width="126" height="38" rx="19" fill="#FFFFFF" fill-opacity="0.9" stroke="#FFFFFF" stroke-width="1.5" />
    <circle cx="29" cy="19" r="9" fill="#0F172A" />
    <path d="M 26 25 C 26 23 25 22 25 20 C 25 18 26.5 16.5 29 16.5 C 31.5 16.5 33 18 33 20 C 33 22 32 23 32 25" fill="#FFFFFF" />
    <text x="46" y="24" font-family="-apple-system, BlinkMacSystemFont, &#39;Inter&#39;, sans-serif" font-size="14.5" font-weight="600" fill="#1E293B">GitHub</text>
  </g>

  <!-- Bottom Floating Tagline Capsule -->
  <g transform="translate(340, 258)" filter="url(#pillShadow)">
    <rect width="280" height="34" rx="17" fill="#F8FAFC" stroke="#FFFFFF" stroke-width="2" />
    <text x="140" y="22" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, &#39;Inter&#39;, sans-serif" font-size="12.5" font-weight="600" fill="#334155">Building the future of AI & Agents</text>
  </g>
</svg>