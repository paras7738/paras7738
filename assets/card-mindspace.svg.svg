<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 148" width="100%">
  <defs>
    <linearGradient id="iconBoxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    <filter id="cardDrop" x="-3%" y="-6%" width="106%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#64748B" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Frosted Card Body -->
  <rect x="10" y="8" width="940" height="130" rx="22" fill="#F8FAFC" stroke="#FFFFFF" stroke-width="2.5" filter="url(#cardDrop)" />

  <!-- Left Icon Box (Parrot + Chain Link) -->
  <g transform="translate(32, 29)">
    <rect width="88" height="88" rx="20" fill="url(#iconBoxGrad)" stroke="#FFFFFF" stroke-width="2" />
    <!-- Stylized Parrot -->
    <path d="M 26 58 C 22 44 26 30 36 28 C 43 27 46 34 45 42 C 44 50 38 58 26 58 Z" fill="#65A30D" />
    <path d="M 30 38 C 34 38 38 43 36 52" fill="none" stroke="#FACC15" stroke-width="3.5" stroke-linecap="round" />
    <path d="M 42 31 L 48 34 L 42 37 Z" fill="#EF4444" />
    <circle cx="38" cy="33" r="1.8" fill="#0F172A" />
    <!-- Chain Link -->
    <g transform="translate(46, 36) rotate(-30)">
      <rect x="0" y="6" width="20" height="10" rx="5" fill="none" stroke="#64748B" stroke-width="3" />
      <rect x="12" y="6" width="20" height="10" rx="5" fill="none" stroke="#475569" stroke-width="3" />
    </g>
  </g>

  <!-- Project Title & Subtitle -->
  <text x="142" y="48" font-family="-apple-system, BlinkMacSystemFont, &#39;Inter&#39;, &#39;Segoe UI&#39;, sans-serif" font-size="20" font-weight="800" fill="#0F172A">mindspace_AgenticAI</text>
  <text x="142" y="74" font-family="-apple-system, BlinkMacSystemFont, &#39;Inter&#39;, &#39;Segoe UI&#39;, sans-serif" font-size="16" font-weight="400" fill="#334155">LangChain tool-calling agent with multi-LLM routing, powered by FastAPI & Streamlit.</text>

  <!-- Pastel Pills -->
  <g transform="translate(142, 88)">
    <rect x="0" y="0" width="76" height="28" rx="14" fill="#6EE7B7" />
    <text x="38" y="19" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, &#39;Inter&#39;, sans-serif" font-size="13" font-weight="700" fill="#064E3B">Python</text>

    <rect x="86" y="0" width="98" height="28" rx="14" fill="#F9A8D4" />
    <text x="135" y="19" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, &#39;Inter&#39;, sans-serif" font-size="13" font-weight="700" fill="#831843">LangChain</text>

    <rect x="194" y="0" width="68" height="28" rx="14" fill="#A5B4FC" />
    <text x="228" y="19" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, &#39;Inter&#39;, sans-serif" font-size="13" font-weight="700" fill="#1E1B4B">Async</text>
  </g>
</svg>