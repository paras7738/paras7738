<svg width="1200" height="430" viewBox="0 0 1200 430" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="430" gradientUnits="userSpaceOnUse">
      <stop stop-color="#07111F"/><stop offset="0.55" stop-color="#0A1020"/><stop offset="1" stop-color="#130D24"/>
    </linearGradient>
    <linearGradient id="neon" x1="120" y1="0" x2="1040" y2="430" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6EE7FF"/><stop offset="0.45" stop-color="#8B5CF6"/><stop offset="1" stop-color="#FF4ECD"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#67E8F9"/><stop offset="1" stop-color="#A78BFA"/></linearGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M42 0H0V42" stroke="#A7C7FF" stroke-opacity=".08"/></pattern>
    <filter id="glow"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="35"/></filter>
    <style>
      .mono{font-family:'SFMono-Regular',Consolas,'Liberation Mono',monospace}.sans{font-family:Inter,ui-sans-serif,system-ui,sans-serif}
      .blink{animation:blink 1.2s steps(2,end) infinite}.float{animation:float 6s ease-in-out infinite}.pulse{animation:pulse 3s ease-in-out infinite}
      @keyframes blink{50%{opacity:0}} @keyframes float{50%{transform:translateY(-10px)}} @keyframes pulse{50%{opacity:.55}}
    </style>
  </defs>
  <rect width="1200" height="430" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="430" rx="28" fill="url(#grid)"/>
  <circle cx="1020" cy="85" r="170" fill="#7C3AED" fill-opacity=".15" filter="url(#soft)"/>
  <circle cx="180" cy="370" r="150" fill="#06B6D4" fill-opacity=".13" filter="url(#soft)"/>
  <path d="M-40 352C155 260 234 458 455 326C670 198 745 319 923 203C1045 124 1130 176 1240 88" stroke="url(#neon)" stroke-width="2" stroke-opacity=".5"/>
  <path d="M-50 380C150 284 249 477 468 347C671 226 772 342 944 228C1050 158 1140 189 1240 113" stroke="url(#neon)" stroke-width="1" stroke-opacity=".22"/>
